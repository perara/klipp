name: ✨ Feature request
description: Something Klipp can't do yet that you need.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How you manage today
